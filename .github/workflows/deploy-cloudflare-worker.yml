name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/liff/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - 'packages/update-engine/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'

jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine build

      - name: Run pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_DATABASE_NAME"

          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command \
            "CREATE TABLE IF NOT EXISTS _migrations (name TEXT PRIMARY KEY, applied_at TEXT NOT NULL)"

          for f in $(ls packages/db/migrations/*.sql | sort); do
            name=$(basename "$f")
            applied=$(npx wrangler d1 execute "$D1_DATABASE_NAME" --remote \
              --command "SELECT name FROM _migrations WHERE name = '${name}'" --json \
              | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));console.log(d[0]?.results?.length||0)")
            if [ "$applied" = "0" ]; then
              echo "Applying: $name"
              npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file="$f"
              npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command \
                "INSERT INTO _migrations (name, applied_at) VALUES ('${name}', datetime('now'))"
            else
              echo "Skipped: $name"
            fi
          done

      - name: Build Worker and LIFF assets
        run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - name: Patch wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'your-worker-name' }}
          # Admin CORS config — set these as repo Variables when the admin panel
          # and the Worker API are on different origins (e.g. *.pages.dev admin
          # + *.workers.dev API). Baking them into the deployed config (vars)
          # means every deploy carries them, so they can't be silently dropped
          # the way a manually-set dashboard variable is on redeploy.
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          ADMIN_ALLOW_CROSS_SITE: ${{ vars.ADMIN_ALLOW_CROSS_SITE }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          test -n "$D1_DATABASE_ID"
          cd apps/worker
          sed -i \
            -e "s|\"account_id\":\"[^\"]*\"|\"account_id\":\"${CLOUDFLARE_ACCOUNT_ID}\"|g" \
            -e "s|\"database_name\":\"[^\"]*\"|\"database_name\":\"${D1_DATABASE_NAME}\"|g" \
            -e "s|\"database_id\":\"[^\"]*\"|\"database_id\":\"${D1_DATABASE_ID}\"|g" \
            dist/line_harness/wrangler.json
          # Inject admin CORS vars into the deployed config when ADMIN_ORIGIN is
          # set. ADMIN_ALLOW_CROSS_SITE defaults to "true" (SameSite=None; Secure
          # cookies) since cross-origin admin/API is the case that needs it.
          if [ -n "$ADMIN_ORIGIN" ]; then
            tmp="$(mktemp)"
            jq --arg o "$ADMIN_ORIGIN" --arg x "$ADMIN_ALLOW_CROSS_SITE" --arg w "$WORKER_URL" '
              .vars.ADMIN_ORIGIN = $o
              | .vars.ADMIN_ALLOW_CROSS_SITE = (if $x == "" then "true" else $x end)
              | (if $w != "" then .vars.WORKER_URL = $w else . end)
            ' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
            echo "Patched admin CORS vars: ADMIN_ORIGIN=$ADMIN_ORIGIN ADMIN_ALLOW_CROSS_SITE=${ADMIN_ALLOW_CROSS_SITE:-true}"
          fi

      # Fork deploys ship the default (test) env of wrangler.toml, whose R2
      # bucket, public URLs and self-update vars are upstream placeholders.
      # Align them with the resources create-line-harness provisioned. Each
      # value is optional; unset Variables leave the built config untouched.
      - name: Patch fork-specific wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          ADMIN_PAGES_PROJECT: ${{ vars.PAGES_PROJECT_NAME }}
          LIFF_PAGES_PROJECT: ${{ vars.LIFF_PAGES_PROJECT }}
          WORKER_PUBLIC_URL: ${{ vars.WORKER_PUBLIC_URL }}
          ADMIN_PUBLIC_URL: ${{ vars.ADMIN_PUBLIC_URL }}
          LIFF_PUBLIC_URL: ${{ vars.LIFF_PUBLIC_URL }}
          # Workers Cache is a pilot upstream enables only on its private test
          # Worker (production sets it to false). Opt in explicitly.
          WORKER_CACHE_ENABLED: ${{ vars.WORKER_CACHE_ENABLED }}
        run: |
          cd apps/worker
          tmp="$(mktemp)"
          jq \
            --arg account "$CLOUDFLARE_ACCOUNT_ID" \
            --arg d1 "$D1_DATABASE_ID" \
            --arg worker "$WORKER_NAME" \
            --arg r2 "$R2_BUCKET_NAME" \
            --arg admin_project "$ADMIN_PAGES_PROJECT" \
            --arg liff_project "$LIFF_PAGES_PROJECT" \
            --arg worker_url "$WORKER_PUBLIC_URL" \
            --arg admin_url "$ADMIN_PUBLIC_URL" \
            --arg liff_url "$LIFF_PUBLIC_URL" \
            --arg cache "$WORKER_CACHE_ENABLED" '
              def setvar($k; $v): if $v != "" then .vars[$k] = $v else . end;
              (if $r2 != "" then .r2_buckets |= map(if .binding == "IMAGES" then .bucket_name = $r2 else . end) else . end)
              | .cache.enabled = ($cache == "true")
              | setvar("CF_ACCOUNT_ID"; $account)
              | setvar("D1_DATABASE_ID"; $d1)
              | setvar("WORKER_NAME"; $worker)
              | setvar("ADMIN_PAGES_PROJECT"; $admin_project)
              | setvar("LIFF_PAGES_PROJECT"; $liff_project)
              | setvar("WORKER_PUBLIC_URL"; $worker_url)
              | setvar("ADMIN_PUBLIC_URL"; $admin_url)
              | setvar("LIFF_PUBLIC_URL"; $liff_url)
            ' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
          jq -c "{r2_buckets, cache, public_urls: (.vars | {WORKER_PUBLIC_URL, ADMIN_PUBLIC_URL, LIFF_PUBLIC_URL})}" dist/line_harness/wrangler.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config dist/line_harness/wrangler.json --name ${{ vars.WORKER_NAME || 'your-worker-name' }}
